name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile Python sources
        run: PYTHONPYCACHEPREFIX=/tmp/cprl_pycache python -m compileall run_exp.py exp src scripts utils time_series_library
